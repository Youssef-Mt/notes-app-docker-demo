name: Docker CI - build, deploy, healthcheck, scaling, panne/reprise

on:
  push:
  workflow_dispatch:

jobs:
  secrets-scan:
    name: Vérification d'absence de secret dans l'historique (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-proof:
    name: Preuve de déploiement Docker (build + orchestration + résilience)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Générer les secrets de test (CI uniquement, jamais commités)
        run: |
          echo "DB_PASSWORD=ci_test_password_$(openssl rand -hex 4)" >> .env
          echo "DB_ROOT_PASSWORD=ci_test_root_$(openssl rand -hex 4)" >> .env

      - name: Build de l'image (preuve de maîtrise Docker)
        run: docker compose build

      - name: Démarrage de l'orchestration complète (app + BDD)
        run: docker compose up -d

      - name: Attente que les deux services soient "healthy"
        run: |
          for i in $(seq 1 30); do
            STATUS_APP=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -a -q app) 2>/dev/null || echo "starting")
            STATUS_DB=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -a -q db) 2>/dev/null || echo "starting")
            echo "app=$STATUS_APP db=$STATUS_DB"
            if [ "$STATUS_APP" = "healthy" ] && [ "$STATUS_DB" = "healthy" ]; then
              echo "Les deux services sont sains."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Timeout en attendant que les services soient healthy"
          docker compose logs
          exit 1

      - name: Preuve fonctionnelle - ajout d'une note via HTTP
        run: |
          # Le port hôte n'est plus fixe (voir docker-compose.yml, nécessaire
          # pour pouvoir scaler) : on le résout dynamiquement à chaque fois.
          PORT=$(docker compose port app 8080 | cut -d: -f2)
          echo "APP_PORT=$PORT" >> "$GITHUB_ENV"
          echo "Port résolu : $PORT"
          curl -fsS -X POST "http://localhost:$PORT/" -d "action=add&title=Preuve%20CI&content=Ajoutee%20automatiquement%20par%20le%20pipeline"
          curl -fsS "http://localhost:$PORT/health.php" | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Mise à l'échelle du service applicatif (scaling)
        run: |
          echo "--- Avant mise à l'échelle ---"
          docker compose ps app
          docker compose up -d --scale app=3 --no-recreate
          echo "--- Attente que les 3 instances soient healthy ---"
          for i in $(seq 1 30); do
            HEALTHY=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -a -q app) 2>/dev/null | grep -c healthy || true)
            RUNNING=$(docker compose ps -a -q app | wc -l)
            echo "instances=$RUNNING healthy=$HEALTHY"
            if [ "$RUNNING" -eq 3 ] && [ "$HEALTHY" -eq 3 ]; then
              echo "Les 3 instances sont démarrées et saines."
              break
            fi
            sleep 3
          done
          echo "--- Tableau de bord de supervision pendant la mise à l'échelle (docker compose ps + docker stats) ---"
          docker compose ps app
          docker stats --no-stream $(docker compose ps -a -q app)
          echo "--- Retour à 1 instance (pour la suite du test de panne/reprise) ---"
          docker compose up -d --scale app=1 --no-recreate
          sleep 2
          docker compose ps app

      - name: Simulation de panne du service applicatif
        run: |
          echo "Etat avant panne :"
          docker compose ps
          # Important : "docker kill" sur le conteneur est traité par Docker
          # comme un arrêt VOLONTAIRE de l'opérateur - la politique
          # "unless-stopped" ne redémarre justement PAS dans ce cas (c'est
          # voulu : sinon impossible d'arrêter proprement un service).
          # Pour simuler une vraie panne (crash), on tue le processus
          # principal DEPUIS L'INTÉRIEUR du conteneur : Docker voit alors
          # une sortie inattendue du PID 1 et applique la politique de
          # redémarrage, comme pour un vrai crash applicatif.
          # "kill" via sh -c : c'est un builtin du shell, ça marche même si
          # le binaire /bin/kill autonome n'est pas installé dans l'image.
          # "|| true" : la connexion exec meurt en même temps que le PID 1
          # tué, docker compose exec peut donc remonter une erreur de
          # transport alors que l'action a bien eu lieu - attendu, non
          # bloquant.
          docker compose exec -T app sh -c 'kill -9 1' || true
          sleep 2
          echo "Processus principal tué depuis l'intérieur du conteneur (simulation de crash réel)."

      - name: Preuve de reprise automatique (politique restart:unless-stopped)
        run: |
          # Preuve directe et sans ambiguïté : on interroge le vrai
          # endpoint HTTP de l'appli plutôt que le texte d'état interne de
          # Docker (qui peut rester "unhealthy" un instant après que le
          # service réponde déjà normalement - constaté sur ce projet).
          PORT=$(docker compose port app 8080 | cut -d: -f2)
          echo "Port résolu après reprise : $PORT"
          for i in $(seq 1 40); do
            if curl -fsS -m 2 "http://localhost:$PORT/health.php" 2>/dev/null | grep -q '"status":"ok"'; then
              echo "Le service a répondu de nouveau après $((i*3))s : redémarrage automatique confirmé."
              docker compose ps
              curl -fsS "http://localhost:$PORT/health.php"
              exit 0
            fi
            echo "Tentative $i : pas encore de réponse HTTP saine."
            sleep 3
          done
          echo "::error::Le service ne répond toujours pas après reprise attendue"
          docker compose ps -a
          docker compose logs app
          exit 1

      - name: Nettoyage
        if: always()
        run: docker compose down -v
